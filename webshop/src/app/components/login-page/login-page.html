<div class="container-fluid d-flex justify-content-center align-items-center">

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="container-fluid d-flex flex-column justify-content-between align-items-center py-3">
    <div class="container-fluid">
      <h1>Bejelentkezés</h1>
      @if (errorMsg != null) {
      <div class="row">
        <div class="col-lg-12">
          <p class="text-danger text-center">{{errorMsg}}</p>
        </div>
      </div>
      }
      <div class="row">
        <div class="col-lg-12">
          <label for="email">E-mail</label>
          <input formControlName="email" class="shadow w-100" type="email" id="email" name="email" placeholder="E-mail">
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <label for="password">Jelszó</label>
          <input formControlName="password" class="shadow w-100" type="password" id="password" name="passwords"
            placeholder="Jelszó">
        </div>
      </div>
      <div class="row">
        <a routerLink="/passwordReset" id="forgotPassword">Elfelejtettem a jelszavam</a>
      </div>
    </div>

    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12 d-flex justify-content-center align-items-center">
          <button [disabled]="loginForm.invalid" class="shadow">Bejelentkezés</button>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12 d-flex justify-content-center align-items-center">
          <p>Nincs fiókod? <a routerLink="/register" id="registerButton">Regisztrálj itt!</a></p>
        </div>
      </div>
    </div>
  </form>
</div>
