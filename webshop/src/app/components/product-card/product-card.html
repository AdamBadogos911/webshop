<div class="container-fluid cardContainer d-flex flex-column justify-content-between" (click)="navigateToDetails()">
  <div class="row">
    <div class="kep col-lg-12 d-flex flex-column justify-content-center align-items-center">
      <img [src]="product().images[0]?.imagePath" alt="Keszlet" class="img-fluid my-4">
      @if (product().brand.name.toString() == "non"){
        <h4 class="w-100 text-lg-start text-center">{{product().name}}</h4>
      } @else {
        <h4 class="w-100 text-lg-start text-center">{{product().brand.name}} - {{product().name}}</h4>
      }
    </div>
  </div>

  <div class="row">
  <div class="col-lg-12 col-md-12 col-sm-12">
      <div>
        <p class="m-0">
          @if (product().amount == 0) {
            Nincs raktáron
          } @else {
            Raktáron
          }
        </p>
      </div>
      <p class="d-flex justify-content-between price">
        <span>Bruttó ár:</span>
        <span>{{product().price}},-Ft</span>
      </p>
    </div>
  </div>
</div>
