<div class="container-fluid position-fixed sticky-top" (mouseenter)="close.emit()">
  <div class="row">
    <div class="col-lg-12">
    </div>
  </div>
</div>

<div class="container-fluid" id="categoryContainer">
  <div class="row">
    <div class="mainCategory col-lg-4 col-md-4 col-sm-6 col-xs-6 d-flex flex-column">
      @for (mainCategory of mainCategories; track $index) {
      <button class="my-2" (mouseover)="getAllSubCategory(mainCategory.id!)">{{mainCategory.name}} -></button>
      }
    </div>
    <div class="subCategory col-lg-8 col-md-8 col-sm-6 col-xs-6 d-flex flex-column">
      @for (subCategory of subCategories; track $index) {
      <button class="" (click)="navigateToProductList(subCategory.id!)">{{subCategory.name}}</button>
      }
    </div>
  </div>
</div>
