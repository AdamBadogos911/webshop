<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-4 d-flex flex-column">
            @for (mainCategory of mainCategories; track $index) {
              <button class="my-2" (mouseover)="getAllSubCategory(mainCategory.id!)">{{mainCategory.name}}</button>
            }
          </div>
          <div class="col-lg-8 d-flex flex-column">
            @for (subCategory of subCategories; track $index) {
              <button class="my-2" >{{subCategory.name}}</button>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
