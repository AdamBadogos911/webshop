<div class="container-fluid" style="min-height: 100vh">
  <div class="row">
    <div class="col-lg-6">
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="assets/keszlet.png" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="assets/keszlet.png" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="assets/keszlet.png" class="d-block w-100" alt="..." />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <div class="col-lg-6">
      <h1 class="text-lg-start text-center">{{ selectedProduct.name }}</h1>
      <h3 class="text-lg-start text-center">{{ selectedProduct.brand }}</h3>

      <div class="w-100 d-flex justify-content-between align-items-center">
        <h4>{{ selectedProduct.price }} FT</h4>
        <select #amountSelect>
          <option value="1" selected>1 db</option>
          <option value="2">2 db</option>
          <option value="3">3 db</option>
          <option value="4">4 db</option>
          <option value="5">5 db</option>
        </select>
      </div>
      <button (click)="addToCart(+amountSelect.value)">Vásárlás</button>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      <div>
        <button (click)="handleReview(false)">Leirás</button>
        <button (click)="handleReview(true)">Értékelések</button>
      </div>

      @if (showReviews) {
        @for (review of reviews; track $index) {
          <app-review-card [review]="review" />
        }
      } @else {
        <p>{{selectedProduct.description}}</p>
      }
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      <h1>Hasonló termékek:</h1>
      <div class="container-fluid">
        <div class="row">
          @for (product of similarProducts; track $index) {
            <div class="col-lg-3">
              <app-product-card [product]="product" />
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
