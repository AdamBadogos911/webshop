<div class="container-fluid p-5">
  @if (!isError) {

      @for (productRow of getRows(); track $index) {
        <div class="row px-3">
          @for (product of productRow; track $index) {
            <div class="col-lg-3  my-4 d-flex justify-content-center align-items-center">
              <app-product-card [product]="product" />
            </div>
          }
        </div>
    }
  } @else {
    <div class="row">
      <div class="col-lg-12">
        <h1 class="text-center">Hiba történt! Kérlek próbáld meg később!!!</h1>
      </div>
    </div>
  }
</div>
