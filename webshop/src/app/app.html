  <div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <app-navbar (openNavBar)="isNavbarOpen.set($event)" style="position: sticky;"/>
      @if (isNavbarOpen()) {
        <app-opened-navbar (close)="isNavbarOpen.set(false)" style="position: fixed; z-index: 1000;"/>
      }
    </div>
  </div>
  <div id="main">
    <div class="row">
      <div class="col-lg-12">
        <router-outlet />
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <app-footer />
      </div>
    </div>
  </div>
</div>
