      <app-navbar (openNavBar)="isNavbarOpen.set($event)" style="position: sticky;"/>

        <app-opened-navbar style="position: fixed; z-index: 2;"/>

  </div>
  <div class="row">

      <router-outlet />

  </div>
  <div class="row">

      <app-footer />
    </div>
  </div>
</div>
