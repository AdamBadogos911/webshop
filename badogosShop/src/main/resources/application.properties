spring.application.name=badogosShop
spring.profiles.active=${SPRING_PROFILE:dev}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/badogos_shop}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:warn}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:warn}

jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expired-time=${JWT_EXPIRED_TIME:900000}
jwt.refresh-expired-time=${JWT_REFRESH_EXPIRED_TIME:7200000}
jwt.issuer=${JWT_ISSUER:badogosShop}
spring.web.resources.static-locations=file:./images/,classpath:/static/

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Email konfiguracios beallitasok
# Az alabbi beallitasok szuksegesek az email kuldeshez
# Gmail hasznalata eseten: https://myaccount.google.com/apppasswords
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:noreply@badogosShop.com}

management.health.mail.enabled=false

# Fajl feltoltesi meretkorlatozas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.rate-limit.general.max-requests=${RATE_LIMIT_GENERAL_MAX:60}
app.rate-limit.general.time-window-seconds=${RATE_LIMIT_GENERAL_WINDOW:60}

app.rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX:10}
app.rate-limit.auth.time-window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}